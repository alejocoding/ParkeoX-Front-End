<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<div class="modal-overlay">

  <div class="modal">

    <!-- HEADER -->

    <div class="modal-header">

      <div class="header-info">

        <div class="header-icon">
          <i class="fa-solid fa-user-pen"></i>
        </div>

        <div>
          <h2>Editar integrante</h2>
          <p>{{ usuario?.name }} &middot; {{ usuario?.email }}</p>
        </div>

      </div>

      <button class="btn-close" (click)="closeModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>

    <!-- SELF WARNING -->

    <div class="self-warning" *ngIf="esUnoMismo">
      <i class="fa-solid fa-circle-info"></i>
      Estás editando tu propia cuenta. El rol y el estado no se pueden modificar desde aquí para evitar bloqueos accidentales.
    </div>

    <!-- BODY -->

    <div class="modal-body">

      <div class="form-grid">

        <div class="form-group">
          <label>
            <i class="fa-solid fa-id-card"></i>
            Cédula
          </label>
          <input type="text" [(ngModel)]="editedCedula" placeholder="Ej: 1032456789">
        </div>

        <div class="form-group">
          <label>
            <i class="fa-solid fa-user"></i>
            Nombre completo
          </label>
          <input type="text" [(ngModel)]="editedName" placeholder="Ej: Laura Gómez">
        </div>

        <div class="form-group">
          <label>
            <i class="fa-solid fa-phone"></i>
            Teléfono
          </label>
          <input type="text" [(ngModel)]="editedTelefono" placeholder="Ej: 3001234567">
        </div>

        <div class="form-group">
          <label>
            <i class="fa-solid fa-envelope"></i>
            Correo electrónico
          </label>
          <input type="email" [(ngModel)]="editedEmail" placeholder="Ej: laura@empresa.com">
        </div>

        <div class="form-group">
          <label>
            <i class="fa-solid fa-user-shield"></i>
            Rol
          </label>
          <select [(ngModel)]="editedRoleId" [disabled]="esUnoMismo">
            <option *ngFor="let r of roles" [ngValue]="r.id">{{ r.rol }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            <i class="fa-solid fa-toggle-on"></i>
            Estado
          </label>
          <select [(ngModel)]="editedStatusId" [disabled]="esUnoMismo">
            <option *ngFor="let s of statusList" [ngValue]="s.id">{{ s.status }}</option>
          </select>
        </div>

        <div class="form-group full">
          <label>
            <i class="fa-solid fa-building"></i>
            Compañía
          </label>
          <input type="text" [value]="usuario?.company" disabled>
        </div>

      </div>

      <button class="btn-save" [disabled]="guardando" (click)="guardarCambios()">
        <i class="fa-solid fa-floppy-disk"></i>
        {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
      </button>

    </div>

  </div>

</div>
