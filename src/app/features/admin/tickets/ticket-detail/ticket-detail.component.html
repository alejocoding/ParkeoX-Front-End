<div class="modal-backdrop">

  <div class="ticket-print">

    <div class="header">

      <h2>PARKEOX</h2>

      <button class="close-btn" (click)="closeModal()">
        X
      </button>

    </div>

    <form action="" class="ticket-form">

    <label for="">Id </label>
    <input type="text" value="{{ ticket.id }}" readonly>

    <label for="">Vehiculo </label>
    <input type="text" value=" {{ ticket.vehicle }}" readonly style="text-transform: uppercase;">

    <label for="">Ingreso</label>
    <input type="text" value="{{ ticket.checkInAt | date:'dd/MM/yyyy HH:mm'  }}" readonly>

    <label for="">Salida</label>
    <input type="datetime" value="{{ ticket.checkOutAt | date:'yyyy-MM-ddTHH:mm'  }}" readonly>

    <label for="">Tipo:</label>
    <Select name="" id="" readonly>
      <option value="" selected>{{ ticket.tariff }}</option>
      <option value=""></option>
    </Select>

    <label for="">Estado:</label>
    <input type="text" value="{{ ticket.status }}" readonly>

    <label for="">Total:</label>
    <input type="text" value="{{ ticket.total }}" readonly>

    </form>

    <button class="btn-print" (click)="printTicket()">
      <i class="fa-solid fa-print"></i>
      Imprimir
    </button>
    <button class="btn-print" (click)="closeModal()">
      <i class="fa-solid fa-x"></i>
      Cerrar Ticket
    </button>

  </div>

</div>
