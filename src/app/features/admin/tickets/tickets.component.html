<div class="tickets-page">

  <!-- HEADER -->

  <div class="tickets-header">

    <div>
      <h1>
        <i class="fa-solid fa-square-parking"></i>
        Control de Tickets
      </h1>
      <p>Gestión rápida de ingresos y salidas</p>
    </div>

  </div>

  <!-- TABS -->

  <div class="tabs-row">
    <button class="tab-btn" [class.active]="activeTab === 'hoy'" (click)="switchTab('hoy')">
      <i class="fa-solid fa-calendar-day"></i>
      Hoy
    </button>
    <button class="tab-btn" [class.active]="activeTab === 'detallado'" (click)="switchTab('detallado')">
      <i class="fa-solid fa-clock-rotate-left"></i>
      Detallado
    </button>
  </div>

  <!-- FILTERS -->

  <div class="filters-panel">

    <div class="filter-box search-box">
      <label>BUSCAR / CREAR PLACA</label>
      <div class="input-with-action">
        <input
          type="text"
          [ngModel]="searchPlate"
          (ngModelChange)="onSearchPlateChange($event)"
          placeholder="ABC-123"
          maxlength="7" />
        <button
          class="btn-quick-create"
          *ngIf="searchPlate"
          title="Crear ticket con esta placa"
          (click)="quickCreateFromSearch()">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
    </div>

    <div class="filter-box" *ngIf="activeTab === 'detallado'">
      <label>DÍA</label>
      <input type="date" [(ngModel)]="detalladoDate" />
    </div>

  </div>

  <!-- CONTEO / FILTRO POR ICONO -->

  <div class="vehicle-cards-row">

    <button class="vehicle-card" [class.active]="vehicleTypeFilter === 'Motocicleta'" (click)="toggleVehicleFilter('Motocicleta')">
      <i class="fa-solid fa-motorcycle"></i>
      <span class="vehicle-card-label">Moto</span>
      <span class="vehicle-card-count">{{ motoCount }}</span>
    </button>

    <button class="vehicle-card" [class.active]="vehicleTypeFilter === 'Particular'" (click)="toggleVehicleFilter('Particular')">
      <i class="fa-solid fa-car"></i>
      <span class="vehicle-card-label">Carro</span>
      <span class="vehicle-card-count">{{ carroCount }}</span>
    </button>

  </div>

  <!-- CONTENIDO: TABLA + PANEL DE DETALLE -->

  <div class="tickets-content">

    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>Placa</th>
            <th>Hora entrada</th>
            <th>Fecha</th>
            <th>ID</th>
          </tr>
        </thead>

        <tbody>

          <tr
            *ngFor="let ticket of filteredTickets"
            (click)="selectTicket(ticket)"
            [class.selected]="selectedTicket?.id === ticket.id">

            <td class="plate">
              {{ plateNoDash(ticket.vehicle) | uppercase }}
            </td>

            <td>
              {{ ticket.checkInAt | date:'HH:mm' }}
            </td>

            <td>
              {{ ticket.checkInAt | date:'dd/MM/yyyy' }}
            </td>

            <td>
              {{ ticket.id }}
            </td>

          </tr>

          <tr *ngIf="filteredTickets.length === 0">
            <td colspan="4" class="empty-row">
              <i class="fa-solid fa-ticket"></i>
              No se encontraron tickets
            </td>
          </tr>

        </tbody>

      </table>

    </div>

    <app-ticket-detail
      [ticket]="selectedTicket"
      [companyName]="companyName"
      [tariffs]="tariffs"
      (ticketClosed)="onTicketClosed()">
    </app-ticket-detail>

  </div>

</div>
