
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<section class="auth">

  <div class="auth-container">

    <!-- IZQUIERDA -->
    <div class="auth-left">
      <a href="/">
        <h1 class="logo">Parke<span>OX</span></h1>
      </a>

      <p class="tag">RECUPERA TU ACCESO</p>

      <h2>
        Ya casi terminas,
        <span>crea tu nueva contraseña.</span>
      </h2>

      <p class="desc">
        Elige una contraseña segura para proteger el acceso a tu cuenta.
      </p>

      <div class="icons">
        <img src="assets/img/carro.png" width="50px" alt="">
        <img src="assets/img/barras.png" width="50px" alt="">
        <img src="assets/img/verdadero.png" width="50px" alt="">
      </div>

      <img src="assets/img/hombrePC.png" class="hero-img">
    </div>

    <!-- DERECHA -->
    <div class="auth-right">

      <div class="step-indicator">
        <div class="step done">
          <span class="step-circle"><i class="fas fa-check"></i></span>
          <span class="step-label">Correo</span>
        </div>
        <div class="step-line"></div>
        <div class="step done">
          <span class="step-circle"><i class="fas fa-check"></i></span>
          <span class="step-label">Código</span>
        </div>
        <div class="step-line"></div>
        <div class="step active">
          <span class="step-circle">3</span>
          <span class="step-label">Nueva clave</span>
        </div>
      </div>

      <h2>Crea una nueva contraseña</h2>
      <p class="sub">Debe ser diferente a las contraseñas anteriores</p>

      <form>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="Nueva contraseña" [(ngModel)]="newPassword" name="newPassword">
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="Confirmar contraseña" [(ngModel)]="confirmPassword" name="confirmPassword">
        </div>

        <button type="button" class="btn-primary" routerLink="/login">
          Restablecer contraseña
        </button>

        <p class="switch">
          <a routerLink="/login"><i class="fas fa-arrow-left"></i> Volver a iniciar sesión</a>
        </p>

      </form>
    </div>

  </div>

</section>
