<!-- LIBERIAS ADICIONALESK -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- SIDEBAR -->
<aside class="sidebar">

  <!-- LOGO -->
  <div>

    <div class="logo">
      <div class="logo-icon">OX</div>
      <span>PARKEOX</span>
    </div>

    <!-- MENU -->
    <nav class="menu">

      <a *ngFor="let item of menuItems" [routerLink]="item.route" routerLinkActive="active" class="menu-item">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>

    </nav>
  </div>

  <!-- BOTTOM -->
  <div class="sidebar-bottom">

    <a routerLink="/admin/settings" class="menu-item">
      <i class="fas fa-cog"></i>
      <span>Settings</span>
    </a>

    <a (click)="logout()" class="menu-item">
      <i class="fas fa-right-from-bracket"></i>
      <span>Log out</span>
    </a>


  </div>

</aside>
